# Perfil de desarrollo local: lo activa ./gradlew bootRun. Nunca activarlo en producción.

# Logs en texto legible (anula el formato JSON por defecto) con el contexto de correlación de cada petición
logging.structured.format.console=
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-},u=%X{usuarioId:-},i=%X{iglesiaId:-}] 

# Documentación de la API: especificación en /v3/api-docs y Swagger UI en /swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
