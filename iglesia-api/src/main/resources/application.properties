spring.application.name=iglesia-api
# Variables locales opcionales (archivo .env ignorado por git; ver .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PUERTO:8080}

# Base de datos. La aplicación se conecta con un rol que NO es dueño de las tablas (para que la RLS se aplique);
# Flyway usa el rol dueño, que crea tablas y políticas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iglesia_negocio}
spring.datasource.username=${DB_APP_USUARIO:iglesia_app}
spring.datasource.password=${DB_APP_CONTRASENA}
spring.flyway.user=${DB_DUENO_USUARIO}
spring.flyway.password=${DB_DUENO_CONTRASENA}
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.rol_aplicacion=${DB_APP_USUARIO:iglesia_app}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# API
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# JWT emitido por iglesia-seguridad: claves públicas por JWKS, emisor y audiencia validados
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URI:http://localhost:8081/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_EMISOR:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.audiences=iglesia-api
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# CORS: orígenes del frontend separados por coma
api.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}

# Logs: JSON estructurado (ECS) por defecto, seguro para producción; el perfil local los deja en texto
logging.structured.format.console=ecs

# IP real del cliente detrás del proxy inverso (X-Forwarded-For); solo el proxy debe ser alcanzable
server.forward-headers-strategy=framework

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
