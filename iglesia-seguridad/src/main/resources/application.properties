spring.application.name=iglesia-seguridad
# Variables locales opcionales (archivo .env ignorado por git; ver .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PUERTO:8081}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iglesia_seguridad}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CONTRASENA}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

# API
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# JWT (RS256). Las claves se indican como ubicaciones (file: o classpath:); generar en local con scripts/generar-claves-jwt.sh
seguridad.jwt.emisor=${JWT_EMISOR:http://localhost:8081}
seguridad.jwt.audiencias=iglesia-api,iglesia-seguridad
seguridad.jwt.audiencia-propia=iglesia-seguridad
seguridad.jwt.duracion-token-acceso=${JWT_DURACION_ACCESO:15m}
seguridad.jwt.duracion-token-refresco=${JWT_DURACION_REFRESCO:7d}
seguridad.jwt.clave-publica=${JWT_CLAVE_PUBLICA:file:./config/claves/publica.pem}
seguridad.jwt.clave-privada=${JWT_CLAVE_PRIVADA:file:./config/claves/privada.pem}

# CORS: orígenes del frontend separados por coma
seguridad.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}

# Administrador del sistema inicial: se crea solo si no existe ninguno y ambas variables están definidas
seguridad.admin-inicial.correo=${SEGURIDAD_ADMIN_CORREO:}
seguridad.admin-inicial.contrasena=${SEGURIDAD_ADMIN_CONTRASENA:}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
