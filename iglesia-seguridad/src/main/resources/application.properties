spring.application.name=iglesia-seguridad
# Variables locales opcionales (archivo .env ignorado por git; ver .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PUERTO:8081}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iglesia_seguridad}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CONTRASENA}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

# API
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# JWT (RS256). Las claves se indican como ubicaciones (file: o classpath:); generar en local con scripts/generar-claves-jwt.sh
seguridad.jwt.emisor=${JWT_EMISOR:http://localhost:8081}
seguridad.jwt.audiencias=iglesia-api,iglesia-seguridad
seguridad.jwt.audiencia-propia=iglesia-seguridad
seguridad.jwt.duracion-token-acceso=${JWT_DURACION_ACCESO:15m}
seguridad.jwt.duracion-token-refresco=${JWT_DURACION_REFRESCO:7d}
seguridad.jwt.clave-publica=${JWT_CLAVE_PUBLICA:file:./config/claves/publica.pem}
seguridad.jwt.clave-privada=${JWT_CLAVE_PRIVADA:file:./config/claves/privada.pem}

# Cookie HttpOnly del token de refresco; la ruta se ajusta si un proxy inverso cambia el prefijo
seguridad.cookie-refresco.nombre=iglesia_refresco
seguridad.cookie-refresco.ruta=${COOKIE_REFRESCO_RUTA:/api/auth}

# CORS: orígenes del frontend separados por coma
seguridad.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}

# Administrador del sistema inicial: se crea solo si no existe ninguno y ambas variables están definidas
seguridad.admin-inicial.correo=${SEGURIDAD_ADMIN_CORREO:}
seguridad.admin-inicial.contrasena=${SEGURIDAD_ADMIN_CONTRASENA:}

# Logs: JSON estructurado (ECS) por defecto, seguro para producción; el perfil local los deja en texto
logging.structured.format.console=ecs

# IP real del cliente detrás del proxy inverso (X-Forwarded-For); solo el proxy debe ser alcanzable
server.forward-headers-strategy=framework

# Tracing: traceId/spanId por petición (W3C traceparent), en MDC y en la cabecera X-Trace-Id. Sin exportador.
management.tracing.sampling.probability=1.0

# OpenAPI y Swagger UI apagados por defecto (producción); el perfil local los enciende
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
