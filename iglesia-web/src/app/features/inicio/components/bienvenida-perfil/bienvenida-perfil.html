<div class="grid grid-cols-12 gap-8">
    <section class="col-span-12 card flex flex-col sm:flex-row sm:items-center gap-6 mb-0!" aria-labelledby="titulo-inicio">
        <span class="flex items-center justify-center w-16 h-16 shrink-0 rounded-full bg-primary-50 dark:bg-primary-400/10 text-primary">
            <i class="text-3xl" [class]="icono()" aria-hidden="true"></i>
        </span>
        <div class="flex flex-col gap-2 grow">
            <p-tag [value]="etiquetaPerfil()" severity="info" class="self-start" />
            <h1 id="titulo-inicio" class="text-surface-900 dark:text-surface-0 text-2xl font-semibold m-0">{{ titulo() }}</h1>
            <p class="text-muted-color m-0">
                Hola, <span class="font-medium text-surface-900 dark:text-surface-0">{{ correo() }}</span>. {{ descripcion() }}
            </p>
        </div>
    </section>

    <section class="col-span-12 card flex flex-col items-center text-center gap-4 py-12 mb-0!" aria-label="Contenido en preparación">
        <i class="pi pi-hourglass text-4xl text-muted-color" aria-hidden="true"></i>
        <div class="text-surface-900 dark:text-surface-0 text-xl font-medium">Estamos preparando esta sección</div>
        <p class="text-muted-color m-0 max-w-md">Muy pronto encontrarás aquí la información y las herramientas de tu perfil.</p>
    </section>
</div>
