<section class="card flex flex-col gap-6 mb-0!" aria-labelledby="titulo-inicio">
    <div class="flex flex-col md:flex-row md:items-center gap-4 md:gap-6">
        <span class="hidden sm:flex items-center justify-center w-14 h-14 shrink-0 rounded-full bg-primary-50 dark:bg-primary-400/10 text-primary">
            <i class="text-2xl" [class]="icono()" aria-hidden="true"></i>
        </span>
        <div class="flex flex-col gap-1 grow min-w-0">
            <p-tag [value]="etiquetaPerfil()" severity="info" class="self-start" />
            <h1 id="titulo-inicio" class="text-surface-900 dark:text-surface-0 text-2xl font-semibold m-0">{{ titulo() }}</h1>
            <p class="text-muted-color m-0">Hola, <span class="font-medium text-surface-900 dark:text-surface-0">{{ nombre() }}</span>. {{ descripcion() }}</p>
        </div>
    </div>
    <div class="empty:hidden">
        <ng-content />
    </div>
</section>
