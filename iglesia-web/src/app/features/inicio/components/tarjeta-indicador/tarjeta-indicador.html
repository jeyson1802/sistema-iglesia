<dt class="flex items-center gap-2 text-sm text-muted-color">
    @if (icono(); as icono) {
    <i [class]="icono" aria-hidden="true"></i>
    }
    <span>{{ etiqueta() }}</span>
    @if (ayuda(); as ayuda) {
    <i class="pi pi-info-circle text-xs" [pTooltip]="ayuda" tooltipPosition="top" tabindex="0" [attr.aria-label]="ayuda"></i>
    }
</dt>
<dd class="m-0 flex flex-wrap items-baseline gap-x-3 gap-y-1">
    <span class="text-2xl font-semibold tabular-nums text-surface-900 dark:text-surface-0">{{ valor() }}</span>
    @if (cambio() !== undefined) {
    @if (cambio(); as cambio) {
    <span class="text-sm font-medium inline-flex items-center gap-1" [class]="claseCambio()">
        <i [class]="iconoCambio()" class="text-xs" aria-hidden="true"></i>{{ cambio.texto }}<span class="sr-only"> frente al periodo anterior</span>
    </span>
    } @else {
    <span class="text-xs text-muted-color">Sin datos para comparar</span>
    } }
</dd>
