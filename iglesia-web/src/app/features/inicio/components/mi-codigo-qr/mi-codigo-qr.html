<section class="card mb-0! flex flex-col items-center text-center gap-3" aria-labelledby="titulo-mi-codigo">
    <h2 id="titulo-mi-codigo" class="font-semibold text-lg m-0 self-start">Mi código de asistencia</h2>
    <p class="text-sm text-muted-color m-0 self-start text-left">Muéstralo en la entrada del culto o de tu grupo para registrar tu asistencia.</p>
    @if (qr(); as qr) {
    <img [src]="qr" alt="Código QR de asistencia" class="w-56 h-56 rounded-border bg-white" />
    } @else {
    <p-skeleton width="14rem" height="14rem" />
    }
    <p class="font-mono text-lg tracking-widest m-0" aria-label="Código">{{ codigoLegible() }}</p>
    <div class="flex flex-wrap justify-center gap-2">
        <p-button label="Pantalla completa" icon="pi pi-expand" [disabled]="!qr()" (onClick)="pantallaCompleta.set(true)" />
        @if (qr(); as qr) {
        <a [href]="qr" download="mi-codigo-asistencia.png" class="p-button p-button-secondary p-button-outlined no-underline inline-flex items-center gap-2">
            <i class="pi pi-download" aria-hidden="true"></i><span>Descargar</span>
        </a>
        }
    </div>
</section>

<p-dialog [(visible)]="pantallaCompleta" [modal]="true" [maximizable]="false" [dismissableMask]="true" header="Mi código de asistencia" styleClass="w-full max-w-lg mx-4">
    @if (qr(); as qr) {
    <div class="flex flex-col items-center gap-3">
        <img [src]="qr" alt="Código QR de asistencia en grande" class="w-full max-w-md rounded-border bg-white" />
        <p class="font-mono text-xl tracking-widest m-0">{{ codigoLegible() }}</p>
    </div>
    }
</p-dialog>
