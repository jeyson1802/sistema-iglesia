<section [attr.aria-labelledby]="idTitulo()" [attr.aria-busy]="cargando()">
    <header class="flex flex-wrap items-start justify-between gap-2 mb-4">
        <div class="min-w-0">
            <h2 [id]="idTitulo()" class="font-semibold text-lg m-0">{{ titulo() }}</h2>
            @if (descripcion(); as descripcion) {
            <p class="text-sm text-muted-color m-0 mt-1">{{ descripcion }}</p>
            }
        </div>
        @if (ruta(); as ruta) {
        <p-button [label]="etiquetaRuta()" icon="pi pi-arrow-right" iconPos="right" size="small" [text]="true" [routerLink]="ruta" />
        }
    </header>
    @if (cargando()) {
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
        @for (tarjeta of [1, 2, 3, 4]; track tarjeta) {
        <p-skeleton height="5rem" />
        }
    </div>
    <p-skeleton height="12rem" />
    } @else if (error()) {
    <div class="flex flex-col items-start gap-2" role="alert">
        <span class="text-muted-color">No se pudieron cargar estas cifras.</span>
        <p-button label="Reintentar" icon="pi pi-refresh" size="small" severity="secondary" [outlined]="true" (onClick)="reintentar.emit()" />
    </div>
    } @else {
    <ng-content />
    }
</section>
