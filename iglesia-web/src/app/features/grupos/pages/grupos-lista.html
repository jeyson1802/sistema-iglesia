<div class="card">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h1 class="font-semibold text-xl text-surface-900 dark:text-surface-0 m-0 mb-2">{{ nombres().nombreGrupoPlural }}</h1>
            <p class="text-muted-color m-0">Los grupos pequeños de tu iglesia: cada uno es el de su líder. Abre uno para agregar o quitar miembros.</p>
        </div>
        @if (puedeAdministrar() && !errorCarga()) {
        <div class="flex flex-col-reverse sm:flex-row gap-3">
            <p-button label="Cómo se llaman" icon="pi pi-cog" severity="secondary" [outlined]="true" (onClick)="abrirNombres()" />
            <p-button [label]="'Agregar ' + nombres().nombreGrupoSingular.toLowerCase()" icon="pi pi-plus" [disabled]="cargando()" (onClick)="nuevo()" />
        </div>
        }
    </header>

    <div aria-live="polite">
        @if (errorAccion()) {
        <p-message severity="error" icon="pi pi-times-circle" [closable]="true" styleClass="mb-4" (onClose)="errorAccion.set(null)">{{ errorAccion() }}</p-message>
        }
    </div>

    @if (errorCarga()) {
    <div class="flex flex-col items-center gap-4 py-8 text-center" role="alert">
        <i class="pi pi-exclamation-circle text-4xl text-muted-color" aria-hidden="true"></i>
        <span class="font-medium text-surface-900 dark:text-surface-0">{{ errorCarga() }}</span>
        <p-button label="Reintentar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="cargar()" />
    </div>
    } @else {
    <app-tabla-grupos
        [grupos]="grupos()"
        [cargando]="cargando()"
        [puedeAdministrar]="puedeAdministrar()"
        [nombreSingular]="nombres().nombreGrupoSingular"
        [nombrePlural]="nombres().nombreGrupoPlural"
        (editar)="editar($event)"
        (cambiarEstado)="cambiarEstado($event)"
    />
    }
</div>

<app-formulario-grupo [(visible)]="dialogoVisible" [grupo]="grupoEditado()" [nombreSingular]="nombres().nombreGrupoSingular" [guardando]="guardando()" [error]="errorDialogo()" [erroresCampo]="erroresCampo()" (guardar)="guardar($event)" />

<app-nombres-grupos [(visible)]="nombresVisible" [nombres]="nombres()" [guardando]="guardandoNombres()" [error]="errorNombres()" (guardar)="guardarNombres($event)" />

<p-confirmdialog styleClass="w-full max-w-md mx-4" />
