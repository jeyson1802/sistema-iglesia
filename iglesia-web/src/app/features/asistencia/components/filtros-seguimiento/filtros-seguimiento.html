<form [formGroup]="formulario" class="flex flex-col gap-4" role="search" aria-label="Buscar en el seguimiento" (submit)="$event.preventDefault()">
    <p-selectbutton formControlName="alerta" [options]="opcionesAlerta()" optionLabel="etiqueta" optionValue="valor" [allowEmpty]="false" aria-label="Filtrar por alerta" class="flex-wrap">
        <ng-template #item let-opcion>
            <span>{{ opcion.etiqueta }}</span>
            @if (opcion.cantidad !== null) {
            <span class="font-semibold tabular-nums ml-2">{{ opcion.cantidad }}</span>
            }
        </ng-template>
    </p-selectbutton>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div class="flex flex-col gap-2" [class]="opcionesGrupo().length === 0 ? 'md:col-span-2' : ''">
            <label for="filtro-seguimiento-nombre" class="font-medium">Nombre</label>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText id="filtro-seguimiento-nombre" type="search" formControlName="q" autocomplete="off" placeholder="Buscar por nombre o apellido" [fluid]="true" />
            </p-iconfield>
        </div>
        @if (opcionesGrupo().length > 0) {
        <div class="flex flex-col gap-2">
            <label for="filtro-seguimiento-grupo" class="font-medium">{{ etiquetaGrupo() }}</label>
            <p-select inputId="filtro-seguimiento-grupo" formControlName="grupoId" [options]="opcionesGrupo()" optionLabel="nombre" optionValue="id" [filter]="true" [showClear]="true" placeholder="Todos" [fluid]="true" />
        </div>
        }
        <div class="flex items-center gap-2 md:pb-2">
            <p-checkbox inputId="filtro-seguimiento-todos" formControlName="todos" [binary]="true" />
            <label for="filtro-seguimiento-todos">Mostrar también a quienes están al día</label>
        </div>
    </div>
</form>
