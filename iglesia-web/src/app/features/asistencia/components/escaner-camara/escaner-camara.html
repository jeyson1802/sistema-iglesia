<div class="flex flex-col gap-3">
    <div class="relative w-full overflow-hidden rounded-border bg-black aspect-[3/4] sm:aspect-video" [class.opacity-40]="pausado()" [class.hidden]="explicacion() !== null">
        <video #video class="w-full h-full object-cover" muted playsinline aria-label="Vista de la cámara"></video>
        @if (estado() === 'iniciando') {
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-white" role="status">
            <p-progress-spinner strokeWidth="4" styleClass="w-12 h-12" ariaLabel="Encendiendo la cámara" />
            <span>Encendiendo la cámara…</span>
        </div>
        }
    </div>

    @if (estado() === 'activa') {
    <div class="flex items-center justify-between gap-2">
        <span class="text-muted-color text-sm">Apunta al QR del fotocheck o del celular</span>
        <span class="flex gap-2">
            @if (sesion()?.variasCamaras) {
            <p-button icon="pi pi-sync" severity="secondary" [outlined]="true" [rounded]="true" ariaLabel="Cambiar de cámara" (onClick)="cambiarCamara()" />
            } @if (sesion()?.tieneLinterna) {
            <p-button
                icon="pi pi-bolt"
                [severity]="linternaEncendida() ? 'warn' : 'secondary'"
                [outlined]="!linternaEncendida()"
                [rounded]="true"
                [ariaLabel]="linternaEncendida() ? 'Apagar la linterna' : 'Encender la linterna'"
                [attr.aria-pressed]="linternaEncendida()"
                (onClick)="alternarLinterna()"
            />
            }
        </span>
    </div>
    } @if (explicacion(); as explicacion) {
    <div class="flex flex-col items-center gap-3 py-8 px-4 text-center border border-dashed border-surface rounded-border" role="alert">
        <i class="pi pi-video text-4xl text-muted-color" aria-hidden="true"></i>
        <span class="font-semibold text-lg text-surface-900 dark:text-surface-0">{{ explicacion.titulo }}</span>
        <span class="text-muted-color max-w-md">{{ explicacion.detalle }}</span>
        <div class="flex flex-wrap justify-center gap-2 mt-2">
            <p-button label="Volver a intentar" icon="pi pi-refresh" (onClick)="iniciar()" />
            <p-button label="Usar lector" icon="pi pi-barcode" severity="secondary" [outlined]="true" (onClick)="cambiarModo.emit('LECTOR')" />
            <p-button label="Marcar a mano" icon="pi pi-list-check" severity="secondary" [outlined]="true" (onClick)="cambiarModo.emit('MANUAL')" />
        </div>
    </div>
    }
</div>
