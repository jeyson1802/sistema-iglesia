@let datos = indicadores();
<dl class="grid grid-cols-1 sm:grid-cols-3 gap-4 m-0">
    <div>
        <dt class="text-muted-color text-sm">Últimas 8 semanas</dt>
        <dd class="m-0 flex flex-wrap items-center gap-2">
            @if (datos.porcentaje !== null) {
            <span class="text-2xl font-semibold tabular-nums text-surface-900 dark:text-surface-0">{{ datos.porcentaje }} %</span>
            <app-tendencia-asistencia [actual]="datos.porcentaje" [anterior]="datos.porcentajeAnterior" />
            <span class="basis-full text-muted-color text-sm">{{ datos.asistidas }} de {{ datos.reunionesQueCuentan }} ocasiones</span>
            } @else {
            <span class="text-muted-color">Sin datos</span>
            }
        </dd>
    </div>
    <div>
        <dt class="text-muted-color text-sm">Faltas seguidas</dt>
        <dd class="m-0 text-2xl font-semibold tabular-nums text-surface-900 dark:text-surface-0">{{ datos.faltasSeguidas }}</dd>
    </div>
    <div>
        <dt class="text-muted-color text-sm">Última vez</dt>
        <dd class="m-0 text-lg font-medium first-letter:uppercase">{{ hace(datos.ultimaAsistencia) }}</dd>
    </div>
</dl>
