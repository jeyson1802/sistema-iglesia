<button
    type="button"
    class="w-full text-left flex flex-col gap-3 p-5 rounded-border border border-surface bg-surface-0 dark:bg-surface-900 hover:border-primary hover:shadow-md transition-all cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary disabled:opacity-60 disabled:cursor-wait min-h-36"
    [disabled]="abriendo()"
    [attr.aria-label]="etiquetaAccesible()"
    (click)="tomar.emit(reunion())"
>
    <span class="flex items-center justify-between gap-2">
        <p-tag [value]="tipo()" [severity]="severidad()" />
        @if (hora(); as hora) {
        <span class="font-semibold tabular-nums text-muted-color"><i class="pi pi-clock mr-1" aria-hidden="true"></i>{{ hora }}</span>
        }
    </span>
    <span class="font-semibold text-xl text-surface-900 dark:text-surface-0 leading-tight">{{ reunion().nombre }}</span>
    <span class="flex items-center justify-between gap-2 mt-auto">
        @if (abierta()) {
        <span class="text-muted-color"><span class="text-2xl font-bold tabular-nums text-surface-900 dark:text-surface-0">{{ reunion().totalAsistentes }}</span> presentes</span>
        } @else {
        <span class="text-muted-color">Aún sin asistencia</span>
        }
        <span class="flex items-center gap-2 font-medium text-primary">
            @if (abriendo()) {
            <p-progress-spinner strokeWidth="6" styleClass="w-5 h-5" ariaLabel="Abriendo la reunión" />
            } Tomar asistencia <i class="pi pi-arrow-right" aria-hidden="true"></i>
        </span>
    </span>
</button>
