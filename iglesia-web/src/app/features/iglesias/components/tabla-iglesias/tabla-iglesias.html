<p-table
    [value]="filas()"
    [paginator]="true"
    [rows]="filasPorPagina"
    [rowsPerPageOptions]="opcionesPorPagina"
    [showCurrentPageReport]="true"
    [currentPageReportTemplate]="plantillaReporte"
    [alwaysShowPaginator]="true"
    [rowHover]="!cargando()"
    dataKey="id"
    [scrollable]="true"
    tableStyleClass="min-w-160"
    [attr.aria-busy]="cargando()"
>
    <ng-template #header>
        <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Creada</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
        </tr>
    </ng-template>
    <ng-template #body let-iglesia>
        @if (cargando()) {
        <tr>
            <td><p-skeleton width="70%" height="1.5rem" /></td>
            <td><p-skeleton width="40%" height="1.5rem" /></td>
            <td><p-skeleton width="50%" height="1.5rem" /></td>
        </tr>
        } @else {
        <tr>
            <td>
                <div class="flex flex-wrap items-center gap-2">
                    <span class="font-medium">{{ iglesia.nombre }}</span>
                    @if (esActual(iglesia)) {
                    <p-tag value="Actual" severity="info" />
                    }
                </div>
            </td>
            <td class="whitespace-nowrap">{{ iglesia.creadaEn | date: 'dd/MM/yyyy' }}</td>
            <td>
                @if (puedeAdministrar()) {
                <div class="flex justify-end gap-2">
                    @if (!esActual(iglesia)) {
                    <p-button label="Entrar" icon="pi pi-sign-in" size="small" [ariaLabel]="'Entrar a ' + iglesia.nombre" [disabled]="entrando()" (onClick)="entrar.emit(iglesia)" />
                    }
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="secondary" [ariaLabel]="'Editar nombre de ' + iglesia.nombre" pTooltip="Editar nombre" tooltipPosition="top" (onClick)="editar.emit(iglesia)" />
                    <p-button
                        icon="pi pi-user-plus"
                        [rounded]="true"
                        [outlined]="true"
                        severity="secondary"
                        [ariaLabel]="'Crear administrador de ' + iglesia.nombre"
                        pTooltip="Crear administrador"
                        tooltipPosition="top"
                        (onClick)="crearAdministrador.emit(iglesia)"
                    />
                </div>
                }
            </td>
        </tr>
        }
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="3">
                <div class="flex flex-col items-center gap-2 py-8 text-center">
                    <i class="pi pi-building text-4xl text-muted-color" aria-hidden="true"></i>
                    <span class="font-medium text-surface-900 dark:text-surface-0">Aún no hay iglesias</span>
                    <span class="text-muted-color">Da de alta la primera con «Nueva iglesia».</span>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
