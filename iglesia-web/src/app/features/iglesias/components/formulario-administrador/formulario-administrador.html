<p-dialog [(visible)]="visible" header="Crear administrador" [modal]="true" [draggable]="false" [dismissableMask]="!guardando()" [closable]="!guardando()" styleClass="w-full max-w-md mx-4">
    <p class="text-muted-color mt-0 mb-4">Tendrá el rol «Administrador de iglesia» en <span class="font-medium text-surface-900 dark:text-surface-0">{{ iglesia()?.nombreComercial }}</span>.</p>

    <div aria-live="polite">
        @if (error()) {
        <p-message severity="error" icon="pi pi-times-circle" styleClass="mb-4">{{ error() }}</p-message>
        }
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="flex flex-col gap-2" novalidate>
        <app-campos-administrador [grupo]="formulario" idPrefijo="administrador" />

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 mt-4">
            <p-button label="Cancelar" severity="secondary" [outlined]="true" [disabled]="guardando()" (onClick)="cerrar()" />
            <p-button type="submit" label="Crear" icon="pi pi-user-plus" [loading]="guardando()" [disabled]="!valido() || guardando()" />
        </div>
    </form>
</p-dialog>
