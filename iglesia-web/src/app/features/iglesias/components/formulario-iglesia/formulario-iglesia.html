<p-dialog [(visible)]="visible" header="Nueva iglesia" [modal]="true" [draggable]="false" [dismissableMask]="!guardando()" [closable]="!guardando()" styleClass="w-full max-w-3xl mx-4">
    <div aria-live="polite">
        @if (error()) {
        <p-message severity="error" icon="pi pi-times-circle" styleClass="mb-4">{{ error() }}</p-message>
        }
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="flex flex-col gap-6" novalidate>
        <fieldset class="flex flex-col gap-2 border-0 p-0 m-0">
            <legend class="font-semibold mb-2">Datos de la iglesia</legend>
            <app-campos-iglesia [grupo]="formulario.controls.iglesia" idPrefijo="alta-iglesia" [erroresCampo]="erroresCampo()" />
            <small class="text-muted-color">El logo y los colores se eligen después, desde «Editar».</small>
        </fieldset>

        <fieldset class="flex flex-col gap-2 border-0 p-0 m-0">
            <legend class="font-semibold mb-1">Primer administrador</legend>
            <small class="text-muted-color mb-2">Tendrá el rol «Administrador de iglesia» y podrá crear los demás usuarios.</small>
            <app-campos-administrador [grupo]="formulario.controls.administrador" idPrefijo="iglesia-administrador" />
        </fieldset>

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
            <p-button label="Cancelar" severity="secondary" [outlined]="true" [disabled]="guardando()" (onClick)="cerrar()" />
            <p-button type="submit" label="Guardar" icon="pi pi-check" [loading]="guardando()" [disabled]="!valido() || guardando()" />
        </div>
    </form>
</p-dialog>
