<p-dialog [(visible)]="visible" [header]="titulo()" [modal]="true" [draggable]="false" [dismissableMask]="!guardando()" [closable]="!guardando()" styleClass="w-full max-w-xl mx-4">
    <div aria-live="polite">
        @if (error()) {
            <p-message severity="error" icon="pi pi-times-circle" styleClass="mb-4">{{ error() }}</p-message>
        }
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="flex flex-col gap-2" novalidate>
        <div class="flex flex-col gap-2">
            <label for="iglesia-nombre" class="font-medium">Nombre de la iglesia</label>
            <input pInputText id="iglesia-nombre" type="text" formControlName="nombre" autocomplete="organization" [maxlength]="nombreMax" placeholder="Iglesia Central" [fluid]="true" />
            <small class="text-muted-color">Debe ser distinto al de las demás iglesias.</small>
            <app-mensaje-error-campo [control]="formulario.controls.nombre" [mensajes]="mensajesNombre" />
        </div>

        @if (modo() === 'crear') {
            <fieldset class="flex flex-col gap-2 border-0 p-0 m-0">
                <legend class="font-medium mb-1">Primer administrador</legend>
                <small class="text-muted-color mb-2">Tendrá el rol «Administrador de iglesia» y podrá crear los demás usuarios.</small>
                <app-campos-administrador [grupo]="formulario.controls.administrador" idPrefijo="iglesia-administrador" />
            </fieldset>
        }

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 mt-4">
            <p-button label="Cancelar" severity="secondary" [outlined]="true" [disabled]="guardando()" (onClick)="cerrar()" />
            <p-button type="submit" label="Guardar" icon="pi pi-check" [loading]="guardando()" [disabled]="!valido() || guardando()" />
        </div>
    </form>
</p-dialog>
