<section aria-labelledby="titulo-codigo-asistencia" [attr.aria-busy]="cargando()">
    <h2 id="titulo-codigo-asistencia" class="font-semibold text-lg m-0 mb-1">Código de asistencia</h2>
    <p class="text-muted-color text-sm m-0 mb-4">Al llegar, muestra el QR en el celular o el fotocheck impreso.</p>

    @if (cargando()) {
    <p-skeleton width="85.6mm" height="54mm" styleClass="max-w-full mb-4" />
    } @else if (error()) {
    <div class="flex flex-col items-start gap-2" role="alert">
        <span class="text-muted-color">{{ mensajeErrorCarga }}</span>
        <p-button label="Reintentar" icon="pi pi-refresh" size="small" severity="secondary" [outlined]="true" (onClick)="cargar()" />
    </div>
    } @else if (datos(); as fotocheck) {
    <div class="flex justify-center overflow-x-auto mb-4">
        <app-fotocheck [datos]="fotocheck" />
    </div>
    <div class="flex flex-wrap gap-2">
        <p-button label="Descargar" icon="pi pi-download" size="small" [loading]="preparando()" (onClick)="descargar()" />
        @if (puedeCompartir) {
        <p-button label="Compartir" icon="pi pi-share-alt" size="small" severity="secondary" [outlined]="true" [disabled]="preparando()" (onClick)="compartir()" />
        }
        <p-button label="Imprimir" icon="pi pi-print" size="small" severity="secondary" [outlined]="true" (onClick)="imprimir()" />
        @if (puedeRegenerar()) {
        <p-button label="Regenerar código" icon="pi pi-refresh" size="small" severity="danger" [text]="true" [loading]="regenerando()" (onClick)="regenerar()" />
        }
    </div>
    }
</section>
