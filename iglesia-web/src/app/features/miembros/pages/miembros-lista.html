<div class="card">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h1 class="font-semibold text-xl text-surface-900 dark:text-surface-0 m-0 mb-2">Miembros</h1>
            <p class="text-muted-color m-0">Las personas de tu iglesia, nuevas y consolidadas, con su nivel, su líder y dónde viven.</p>
        </div>
        @if (puedeCrear()) {
        <p-button label="Nuevo miembro" icon="pi pi-plus" routerLink="/miembros/nuevo" />
        }
    </header>

    <div class="mb-6">
        <app-filtros-miembros [niveles]="niveles()" (filtrar)="filtrar($event)" />
    </div>

    @if (errorCarga()) {
    <div class="flex flex-col items-center gap-4 py-8 text-center" role="alert">
        <i class="pi pi-exclamation-circle text-4xl text-muted-color" aria-hidden="true"></i>
        <span class="font-medium text-surface-900 dark:text-surface-0">{{ errorCarga() }}</span>
        <p-button label="Reintentar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="cargar()" />
    </div>
    } @else {
    <app-tabla-miembros [miembros]="miembros()" [totalRegistros]="totalRegistros()" [pagina]="pagina()" [cargando]="cargando()" (cambiarPagina)="cambiarPagina($event)" />
    }
</div>
