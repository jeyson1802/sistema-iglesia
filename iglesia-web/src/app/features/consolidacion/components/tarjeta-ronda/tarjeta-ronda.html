<button
    type="button"
    class="w-full h-full text-left card mb-0 flex flex-col gap-4 cursor-pointer border border-surface hover:border-primary transition-colors text-surface-900 dark:text-surface-0"
    (click)="ver.emit(ronda())"
    [attr.aria-label]="'Abrir la ronda ' + ronda().nombre"
>
    <span class="flex items-start justify-between gap-3">
        <span class="min-w-0">
            <span class="block font-semibold text-lg line-clamp-2 break-words">{{ ronda().nombre }}</span>
            <span class="block text-sm text-muted-color">{{ ronda().personas }} personas</span>
        </span>
        @if (plazo(); as plazo) {
        <p-tag [value]="plazo" icon="pi pi-clock" [severity]="vencida() ? 'warn' : 'secondary'" styleClass="whitespace-nowrap" />
        }
    </span>
    <app-medidor-ronda [avance]="ronda()" />
    @if (ronda().vencidos > 0 || ronda().sinAsignar > 0) {
    <span class="flex flex-wrap gap-2">
        @if (ronda().vencidos > 0) {
        <p-tag [value]="ronda().vencidos + ' con contacto vencido'" icon="pi pi-exclamation-triangle" severity="warn" />
        } @if (ronda().sinAsignar > 0) {
        <p-tag [value]="ronda().sinAsignar + ' sin asignar'" icon="pi pi-user-plus" severity="info" />
        }
    </span>
    }
</button>
