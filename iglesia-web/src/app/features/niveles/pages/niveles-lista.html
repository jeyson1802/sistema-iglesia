<div class="card">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h1 class="font-semibold text-xl text-surface-900 dark:text-surface-0 m-0 mb-2">Niveles</h1>
            <p class="text-muted-color m-0">Los rangos de tu iglesia, del más alto al más bajo. Este orden se usa en los selectores de nivel.</p>
        </div>
        @if (!errorCarga()) {
        <p-button label="Nuevo nivel" icon="pi pi-plus" [disabled]="cargando()" (onClick)="nuevo()" />
        }
    </header>

    <div aria-live="polite">
        @if (errorAccion()) {
        <p-message severity="error" icon="pi pi-times-circle" [closable]="true" styleClass="mb-4" (onClose)="errorAccion.set(null)">{{ errorAccion() }}</p-message>
        }
    </div>

    @if (errorCarga()) {
    <div class="flex flex-col items-center gap-4 py-8 text-center" role="alert">
        <i class="pi pi-exclamation-circle text-4xl text-muted-color" aria-hidden="true"></i>
        <span class="font-medium text-surface-900 dark:text-surface-0">{{ errorCarga() }}</span>
        <p-button label="Reintentar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="cargar()" />
    </div>
    } @else {
    <app-tabla-niveles [niveles]="niveles()" [cargando]="cargando()" [ordenando]="ordenando()" (subir)="subir($event)" (bajar)="bajar($event)" (editar)="editar($event)" (cambiarEstado)="cambiarEstado($event)" />
    }
</div>

<app-formulario-nivel [(visible)]="dialogoVisible" [nivel]="nivelEditado()" [guardando]="guardando()" [error]="errorDialogo()" (guardar)="guardar($event)" />

<p-confirmdialog styleClass="w-full max-w-md mx-4" />
