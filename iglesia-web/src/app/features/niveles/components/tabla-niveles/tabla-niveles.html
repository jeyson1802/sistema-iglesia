@if (cargando()) {
<div class="flex flex-col gap-4" role="status" aria-label="Cargando niveles">
    @for (fila of filasCarga; track fila) {
    <div class="flex items-center gap-4">
        <p-skeleton width="3rem" height="1.5rem" />
        <p-skeleton width="40%" height="1.5rem" />
        <p-skeleton width="15%" height="1.5rem" />
    </div>
    }
</div>
} @else {
<p-table [value]="filas()" [rowHover]="true" dataKey="id" [scrollable]="true" tableStyleClass="min-w-160">
    <ng-template #header>
        <tr>
            <th scope="col" class="w-24">Orden</th>
            <th scope="col">Nombre</th>
            <th scope="col">Estado</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
        </tr>
    </ng-template>
    <ng-template #body let-nivel let-indice="rowIndex">
        <tr>
            <td>{{ nivel.orden }}</td>
            <td class="font-medium">{{ nivel.nombre }}</td>
            <td>
                <p-tag [value]="nivel.activo ? 'Activo' : 'Inactivo'" [severity]="nivel.activo ? 'success' : 'danger'" />
            </td>
            <td>
                <div class="flex justify-end gap-2">
                    <p-button
                        icon="pi pi-arrow-up"
                        [rounded]="true"
                        [text]="true"
                        severity="secondary"
                        [ariaLabel]="'Subir ' + nivel.nombre"
                        pTooltip="Subir"
                        tooltipPosition="top"
                        [disabled]="indice === 0 || ordenando()"
                        (onClick)="subir.emit(nivel)"
                    />
                    <p-button
                        icon="pi pi-arrow-down"
                        [rounded]="true"
                        [text]="true"
                        severity="secondary"
                        [ariaLabel]="'Bajar ' + nivel.nombre"
                        pTooltip="Bajar"
                        tooltipPosition="top"
                        [disabled]="indice === niveles().length - 1 || ordenando()"
                        (onClick)="bajar.emit(nivel)"
                    />
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="secondary" [ariaLabel]="'Renombrar ' + nivel.nombre" pTooltip="Renombrar" tooltipPosition="top" (onClick)="editar.emit(nivel)" />
                    @if (nivel.activo) {
                    <p-button icon="pi pi-ban" [rounded]="true" [outlined]="true" severity="danger" [ariaLabel]="'Desactivar ' + nivel.nombre" pTooltip="Desactivar" tooltipPosition="top" (onClick)="cambiarEstado.emit(nivel)" />
                    } @else {
                    <p-button icon="pi pi-replay" [rounded]="true" [outlined]="true" severity="success" [ariaLabel]="'Reactivar ' + nivel.nombre" pTooltip="Reactivar" tooltipPosition="top" (onClick)="cambiarEstado.emit(nivel)" />
                    }
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="4">
                <div class="flex flex-col items-center gap-2 py-8 text-center">
                    <i class="pi pi-sort-amount-up text-4xl text-muted-color" aria-hidden="true"></i>
                    <span class="font-medium text-surface-900 dark:text-surface-0">Aún no hay niveles</span>
                    <span class="text-muted-color">Crea los rangos de tu iglesia (p. ej. «Pastor», «Diácono», «Líder») en su orden.</span>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
}
