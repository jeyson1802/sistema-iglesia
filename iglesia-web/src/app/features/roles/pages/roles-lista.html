<div class="card">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h1 class="font-semibold text-xl text-surface-900 dark:text-surface-0 m-0 mb-2">Roles</h1>
            <p class="text-muted-color m-0">Define qué puede hacer cada persona en el sistema. Los roles base son fijos; los personalizados heredan de uno de ellos.</p>
        </div>
        @if (puedeAdministrar() && !errorCarga()) {
        <p-button label="Nuevo rol" icon="pi pi-plus" [disabled]="cargando()" (onClick)="nuevo()" />
        }
    </header>

    <div aria-live="polite">
        @if (errorAccion()) {
        <p-message severity="error" icon="pi pi-times-circle" [closable]="true" styleClass="mb-4" (onClose)="errorAccion.set(null)">{{ errorAccion() }}</p-message>
        }
    </div>

    @if (errorCarga()) {
    <div class="flex flex-col items-center gap-4 py-8 text-center" role="alert">
        <i class="pi pi-exclamation-circle text-4xl text-muted-color" aria-hidden="true"></i>
        <span class="font-medium text-surface-900 dark:text-surface-0">{{ errorCarga() }}</span>
        <p-button label="Reintentar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="cargar()" />
    </div>
    } @else {
    <app-tabla-roles [roles]="roles()" [cargando]="cargando()" [puedeAdministrar]="puedeAdministrar()" (ver)="ver($event)" (editar)="editar($event)" (cambiarEstado)="cambiarEstado($event)" />
    }
</div>

<app-formulario-rol [(visible)]="dialogoVisible" [modo]="dialogo()?.modo ?? 'crear'" [rol]="dialogo()?.rol ?? null" [rolesBase]="rolesBase()" [catalogo]="catalogo()" [guardando]="guardando()" [error]="errorDialogo()" (guardar)="guardar($event)" />

<p-confirmdialog styleClass="w-full max-w-md mx-4" />
