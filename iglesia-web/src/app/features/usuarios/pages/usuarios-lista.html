<div class="card">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h1 class="font-semibold text-xl text-surface-900 dark:text-surface-0 m-0 mb-2">Usuarios</h1>
            <p class="text-muted-color m-0">Gestiona quién puede entrar al sistema y con qué roles.</p>
        </div>
        @if (puedeAdministrar()) {
        <p-button label="Nuevo usuario" icon="pi pi-plus" [disabled]="roles().length === 0" (onClick)="nuevo()" />
        }
    </header>

    <div class="mb-6">
        <app-filtros-usuarios [roles]="roles()" (filtrar)="filtrar($event)" />
    </div>

    @if (errorCarga()) {
    <div class="flex flex-col items-center gap-4 py-8 text-center" role="alert">
        <i class="pi pi-exclamation-circle text-4xl text-muted-color" aria-hidden="true"></i>
        <span class="font-medium text-surface-900 dark:text-surface-0">{{ errorCarga() }}</span>
        <p-button label="Reintentar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="cargar()" />
    </div>
    } @else {
    <app-tabla-usuarios
        [usuarios]="usuarios()"
        [totalRegistros]="totalRegistros()"
        [pagina]="pagina()"
        [tamanoPagina]="tamanoPagina()"
        [cargando]="cargando()"
        [puedeAdministrar]="puedeAdministrar()"
        [usuarioActualId]="usuarioActualId()"
        (cambiarPagina)="cambiarPagina($event)"
        (editar)="editar($event)"
        (restablecer)="abrirRestablecer($event)"
    />
    }
</div>

<app-formulario-usuario
    [(visible)]="dialogoVisible"
    [modo]="dialogo()?.modo ?? 'crear'"
    [usuario]="dialogo()?.usuario ?? null"
    [roles]="roles()"
    [guardando]="guardando()"
    [error]="errorDialogo()"
    (crear)="crear($event)"
    (actualizar)="actualizar($event)"
/>

<app-restablecer-contrasena [(visible)]="restablecerVisible" [usuario]="usuarioRestablecer()" [guardando]="restableciendo()" [error]="errorRestablecer()" (restablecer)="restablecer($event)" />

<p-toast position="top-right" />
