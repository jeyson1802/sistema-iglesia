<p-toast [key]="clave" position="top-right" [breakpoints]="puntosDeQuiebre">
    <ng-template #message let-mensaje>
        <span class="p-toast-message-icon" [class]="icono(mensaje)" aria-hidden="true"></span>
        <div class="p-toast-message-text">
            <div class="p-toast-summary">{{ mensaje.summary }}</div>
            <div class="p-toast-detail">{{ mensaje.detail }}</div>
            @if (traceId(mensaje); as codigo) {
                <app-codigo-seguimiento class="mt-3" [codigo]="codigo" />
            }
        </div>
    </ng-template>
</p-toast>
