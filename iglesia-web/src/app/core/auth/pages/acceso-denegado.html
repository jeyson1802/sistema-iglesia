<app-tarjeta-acceso tono="advertencia">
    <div class="flex flex-col items-center gap-4 text-center md:w-120">
        <span class="flex justify-center items-center w-[3.2rem] h-[3.2rem] border-2 border-orange-500 rounded-full">
            <i class="pi pi-lock text-orange-500 text-2xl" aria-hidden="true"></i>
        </span>
        <h1 class="text-surface-900 dark:text-surface-0 font-bold text-4xl lg:text-5xl mb-2">Acceso denegado</h1>
        <p class="text-muted-color mb-8">Tu perfil actual no tiene permiso para ver esta página. Si crees que es un error, comunícate con el administrador de tu iglesia.</p>
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
            <a pButton severity="warn" class="w-full sm:w-auto" [routerLink]="rutaInicio">
                <i class="pi pi-home" pButtonIcon></i>
                <span pButtonLabel>Ir a mi inicio</span>
            </a>
            @if (tieneVariosPerfiles()) {
                <a pButton severity="secondary" [outlined]="true" class="w-full sm:w-auto" [routerLink]="rutaSeleccionarPerfil">
                    <i class="pi pi-users" pButtonIcon></i>
                    <span pButtonLabel>Cambiar perfil</span>
                </a>
            }
        </div>
    </div>
</app-tarjeta-acceso>
