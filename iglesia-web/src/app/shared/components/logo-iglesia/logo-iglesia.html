@if (cargando()) {
<p-skeleton shape="circle" size="2.5rem" styleClass="shrink-0" />
<p-skeleton width="9rem" height="1.25rem" styleClass="hidden sm:block" />
} @else { @if (urlLogo(); as url) {
<img [src]="url" alt="" class="h-10 w-auto max-w-24 object-contain shrink-0" [class.h-16]="vertical()" [class.max-w-40]="vertical()" />
} @else if (monograma(); as letras) {
<span aria-hidden="true" class="flex items-center justify-center shrink-0 h-10 w-10 rounded-full bg-primary text-primary-contrast font-marca text-base">{{ letras }}</span>
} @else {
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" focusable="false" class="text-primary shrink-0 w-10 h-10" [class.w-16]="vertical()" [class.h-16]="vertical()">
    <path fill-rule="evenodd" d="M30 4h4v6h5v4h-5v6l16 13v27H14V33l16-13v-6h-5v-4h5V4Zm5 32a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm-7 24V48a4 4 0 0 1 8 0v12h-8Z" />
</svg>
}
<span class="font-marca truncate" [class]="vertical() ? 'text-surface-900 dark:text-surface-0 text-2xl text-center' : 'hidden sm:inline text-xl'">{{ nombre() }}</span>
}
